name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  setup-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: vapourdb
      DB_USERNAME: vapourdb_setup
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update
      - run: sudo apt-get install --yes postgresql-client-16
      - run: pnpm install --frozen-lockfile
      - name: Create a non-superuser login with CREATEDB
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE vapourdb_setup LOGIN PASSWORD 'ci-only-password' CREATEDB"
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - name: Verify setup reports missing CREATEDB on a fresh target
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE vapourdb" -c "ALTER ROLE vapourdb_setup NOCREATEDB"
          if output="$(pnpm db:setup 2>&1)"; then
            printf '%s\n' "$output"
            echo "db:setup unexpectedly created vapourdb without CREATEDB"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "lacks CREATEDB permission" <<< "$output"

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: vapourdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PUBLIC_SITE_URL: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-for-mocked-steam-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install --yes postgresql-client-16
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements.txt pytest
      - run: pnpm db:setup
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm db:doctor
      - run: pnpm db:restore:games -- "tests/fixtures/legacy-games.csv"
      - run: pnpm db:restore:games -- "tests/fixtures/legacy-games.csv"
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - run: pnpm db:games:count -- --expect 2
      - run: docker compose config --quiet
      - run: pnpm db:test:prepare
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
      - run: pnpm db:migrate
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
      - run: pnpm db:test:prepare
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
      - run: pnpm test:db-backup
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:db-doctor
      - run: pnpm db:test:seed-e2e
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
      - run: pnpm test:auth-integration
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
          AUTH_INTEGRATION_TESTS: '1'
          NATIVE_REPORT_INTEGRATION_TESTS: '1'
          NODE_ENV: production
          BETTER_AUTH_URL: https://localhost:5173
          PUBLIC_SITE_URL: https://localhost:5173
          STEAM_API_KEY: ci-mocked-steam-api-key
      - run: python -m pytest -q tests
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
      - run: pnpm db:test:seed-e2e
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
      - run: pnpm build
      - run: docker build --tag vapourdb:ci .
      - name: Validate production Compose configuration with safe fixture values
        env:
          VAPOURDB_IMAGE_REVISION: 0123456789abcdef0123456789abcdef01234567
          VAPOURDB_RUNTIME_ENV_FILE: env.example
        run: docker compose --file deploy/production/compose.yml config --quiet
      - run: docker build --target migration --tag vapourdb:migration-ci .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DB_DATABASE: vapourdb_test
          VAPOURDB_TEST_DATABASE: '1'
          GITHUB_ACTIONS: 'true'
