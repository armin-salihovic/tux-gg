name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      VAPOURDB_BOOTSTRAP_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://vapourdb_dev:ci-dev-password@localhost:5432/vapourdb
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vapourdb_test
      VAPOURDB_DATABASE_MODE: development
      PUBLIC_SITE_URL: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-for-mocked-steam-tests
      VERIFY_DATABASE_SETUP_SAFETY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install --yes postgresql-client-16
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements.txt pytest
      - run: pnpm db:setup -- --bootstrap
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm db:doctor
      - run: pnpm db:restore:games -- "tests/fixtures/legacy-games.csv"
      - run: pnpm db:restore:games -- "tests/fixtures/legacy-games.csv"
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - run: pnpm db:games:count -- --expect 2
      - run: docker compose config --quiet
      - run: python scripts/snapshot_database_setup_baseline.py
        env:
          DATABASE_SETUP_SNAPSHOT: ${{ runner.temp }}/vapourdb-database-permissions.json
      - run: pnpm db:setup:production
        env:
          VAPOURDB_DATABASE_MODE: production
          DATABASE_URL: postgresql://vapourdb_web:ci-web-password@localhost:5432/vapourdb
          IMPORTER_DATABASE_URL: postgresql://vapourdb_importer:ci-importer-password@localhost:5432/vapourdb
          MIGRATION_DATABASE_URL: postgresql://vapourdb_migrator:ci-migrator-password@localhost:5432/vapourdb
      - run: pnpm db:migrate
        env:
          VAPOURDB_DATABASE_MODE: production
          DATABASE_URL: postgresql://vapourdb_web:ci-web-password@localhost:5432/vapourdb
          IMPORTER_DATABASE_URL: postgresql://vapourdb_importer:ci-importer-password@localhost:5432/vapourdb
          MIGRATION_DATABASE_URL: postgresql://vapourdb_migrator:ci-migrator-password@localhost:5432/vapourdb
      - run: pnpm db:grant
        env:
          VAPOURDB_DATABASE_MODE: production
          DATABASE_URL: postgresql://vapourdb_web:ci-web-password@localhost:5432/vapourdb
          IMPORTER_DATABASE_URL: postgresql://vapourdb_importer:ci-importer-password@localhost:5432/vapourdb
          MIGRATION_DATABASE_URL: postgresql://vapourdb_migrator:ci-migrator-password@localhost:5432/vapourdb
      - run: python scripts/verify_database_setup.py
        env:
          DATABASE_SETUP_SNAPSHOT: ${{ runner.temp }}/vapourdb-database-permissions.json
          DATABASE_URL: postgresql://vapourdb_web:ci-web-password@localhost:5432/vapourdb
          IMPORTER_DATABASE_URL: postgresql://vapourdb_importer:ci-importer-password@localhost:5432/vapourdb
          MIGRATION_DATABASE_URL: postgresql://vapourdb_migrator:ci-migrator-password@localhost:5432/vapourdb
      - run: pnpm db:test:prepare
      - run: python scripts/export_ci_test_database_urls.py
        env:
          DATABASE_URL: postgresql://vapourdb_web:ci-web-password@localhost:5432/vapourdb
          IMPORTER_DATABASE_URL: postgresql://vapourdb_importer:ci-importer-password@localhost:5432/vapourdb
          MIGRATION_DATABASE_URL: postgresql://vapourdb_migrator:ci-migrator-password@localhost:5432/vapourdb
      - run: pnpm db:migrate
        env:
          VAPOURDB_DATABASE_MODE: production
      - run: pnpm db:test:prepare
      - run: pnpm test:db-backup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:db-doctor
      - run: pnpm db:test:seed-e2e
      - run: pnpm test:auth-integration
        env:
          AUTH_INTEGRATION_TESTS: '1'
          NATIVE_REPORT_INTEGRATION_TESTS: '1'
          NODE_ENV: production
          BETTER_AUTH_URL: https://localhost:5173
          PUBLIC_SITE_URL: https://localhost:5173
          STEAM_API_KEY: ci-mocked-steam-api-key
      - run: python -m pytest -q tests
      - run: pnpm db:test:seed-e2e
      - run: pnpm build
      - run: docker build --tag vapourdb:ci .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
