name: Release production

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: vapourdb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate semver-like tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "Release commit is not reachable from main"
            exit 1
          fi

  ci:
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate-release, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace published release tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/armin-salihovic/vapourdb
          for tag in "$RELEASE_TAG" "sha-$RELEASE_SHA" "$RELEASE_TAG-migration" "sha-$RELEASE_SHA-migration"; do
            if registry_result=$(docker buildx imagetools inspect "$image:$tag" 2>&1); then
              echo "Refusing to replace existing image tag: $tag"
              exit 1
            fi
            if ! grep -Eiq 'manifest unknown|no such manifest|not found' <<< "$registry_result"; then
              echo "Could not verify that image tag is absent; refusing to publish."
              exit 1
            fi
          done
      - name: Build and publish app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/armin-salihovic/vapourdb:${{ github.ref_name }}
            ghcr.io/armin-salihovic/vapourdb:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish matching migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/armin-salihovic/vapourdb:${{ github.ref_name }}-migration
            ghcr.io/armin-salihovic/vapourdb:sha-${{ github.sha }}-migration
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vapourdb-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install production SSH configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          ssh_key_file="$RUNNER_TEMP/vapourdb_deploy_key"
          known_hosts_file="$RUNNER_TEMP/vapourdb_known_hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$ssh_key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$ssh_key_file" "$known_hosts_file"
          ssh-keygen -F "$DEPLOY_HOST" -f "$known_hosts_file" >/dev/null
          echo "SSH_KEY_FILE=$ssh_key_file" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS_FILE=$known_hosts_file" >> "$GITHUB_ENV"
      - name: Transfer only VapourDB deployment files and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_options=(-i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$target" 'set -eu
            test -d /opt/vapourdb && test ! -L /opt/vapourdb && test -w /opt/vapourdb
            test "$(stat -c "%U:%a" /opt/vapourdb)" = "elecparts:750"
            test -d /opt/vapourdb-config && test ! -L /opt/vapourdb-config
            test "$(stat -c "%U:%a" /opt/vapourdb-config)" = "elecparts:700"
            test -f /opt/vapourdb-config/vapourdb.env && test ! -L /opt/vapourdb-config/vapourdb.env
            test "$(stat -c "%U:%a" /opt/vapourdb-config/vapourdb.env)" = "elecparts:600"
          '
          scp "${ssh_options[@]}" deploy/production/compose.yml deploy/production/deploy.sh "$target:/opt/vapourdb/"
          ssh "${ssh_options[@]}" "$target" "chmod 0750 /opt/vapourdb/deploy.sh && bash /opt/vapourdb/deploy.sh '$RELEASE_TAG' '$RELEASE_SHA'"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/vapourdb_deploy_key" "$RUNNER_TEMP/vapourdb_known_hosts"
