services:
  app:
    build: .
    image: vapourdb:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${ORIGIN:-}
      DB_CONNECTION: ${DB_CONNECTION:?Set DB_CONNECTION=pgsql}
      DB_HOST: ${DB_HOST:?Set DB_HOST to an address reachable from the app container}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE=vapourdb}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
    ports:
      - '127.0.0.1:3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
