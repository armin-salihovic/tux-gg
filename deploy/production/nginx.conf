# Install as /etc/nginx/sites-available/vapourdb and enable as a separate site.
# This certificate and key must cover vapourdb.com specifically.
server {
	listen 80;
	listen [::]:80;
	server_name vapourdb.com;
	return 301 https://vapourdb.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name vapourdb.com;

	include /etc/nginx/cloudflare-realip.conf;
	real_ip_header CF-Connecting-IP;
	real_ip_recursive on;

	ssl_certificate /etc/ssl/cloudflare/vapourdb.com.pem;
	ssl_certificate_key /etc/ssl/cloudflare/vapourdb.com.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# cloudflare-realip.conf maintains trusted Cloudflare proxy ranges.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Port 443;
	}
}
