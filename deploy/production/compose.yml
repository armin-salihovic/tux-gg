name: vapourdb

services:
  app:
    image: ghcr.io/armin-salihovic/vapourdb:sha-${VAPOURDB_IMAGE_REVISION:?Set VAPOURDB_IMAGE_REVISION}
    restart: unless-stopped
    env_file:
      - path: ${VAPOURDB_RUNTIME_ENV_FILE:?Set VAPOURDB_RUNTIME_ENV_FILE}
        format: raw
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - production_internal
    labels:
      org.opencontainers.image.revision: ${VAPOURDB_IMAGE_REVISION:?Set VAPOURDB_IMAGE_REVISION}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    image: ghcr.io/armin-salihovic/vapourdb:sha-${VAPOURDB_IMAGE_REVISION:?Set VAPOURDB_IMAGE_REVISION}-migration
    profiles: [migrations]
    restart: 'no'
    env_file:
      - path: ${VAPOURDB_RUNTIME_ENV_FILE:?Set VAPOURDB_RUNTIME_ENV_FILE}
        format: raw
    networks:
      - production_internal
    labels:
      org.opencontainers.image.revision: ${VAPOURDB_IMAGE_REVISION:?Set VAPOURDB_IMAGE_REVISION}

networks:
  production_internal:
    external: true
    name: production_internal
